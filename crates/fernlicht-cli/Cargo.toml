[package]
name = "fernlicht-cli"
description = "Command line for fernlicht: scan a BMW, play light shows, send single requests"
keywords = ["bmw", "enet", "doip", "uds", "cli"]
categories = ["command-line-utilities"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "fernlicht"
path = "src/main.rs"

[dependencies]
fernlicht = { workspace = true, features = ["serde"] }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
serde_json.workspace = true

[lints]
workspace = true
